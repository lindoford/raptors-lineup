<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Lineup Card</title>
<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║           LITTLE LEAGUE LINEUP CARD  — Kindle Edition        ║
  ║                                                              ║
  ║  HOW TO EDIT:                                                ║
  ║  1. Open this file in any text editor (Notepad, TextEdit...) ║
  ║  2. Scroll down to the GAME section in the <script>          ║
  ║  3. Change teamName, batting order, and each inning          ║
  ║  4. Save and serve (see HOW TO OPEN ON KINDLE below)         ║
  ║                                                              ║
  ║  VALID POSITION KEYS PER INNING:                             ║
  ║    pitcher, catcher, first, second, third, shortstop,        ║
  ║    leftField, leftCenterField, centerField,                  ║
  ║    rightCenterField, rightField                              ║
  ║  Add a bench array to list players sitting that inning.      ║
  ║                                                              ║
  ║  HOW TO OPEN ON KINDLE:                                      ║
  ║  1. Put this file in a folder on your computer               ║
  ║  2. Open a terminal / command prompt in that folder and run: ║
  ║     Mac/Linux:  python3 -m http.server 8080                  ║
  ║     Windows:    python -m http.server 8080                   ║
  ║  3. Find your computer's IP (Mac: System Preferences >       ║
  ║     Network; Windows: run ipconfig, look for IPv4 Address)   ║
  ║  4. Make sure Kindle is on the same WiFi network             ║
  ║  5. Open Kindle browser > type:  http://YOUR_IP:8080/lineup.html
  ╚══════════════════════════════════════════════════════════════╝
-->
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, 'Times New Roman', serif;
  background: #fff;
  color: #000;
  height: 100vh;
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-flex-direction: column;
  flex-direction: column;
  overflow: hidden;
}

/* ── HEADER ── */
#header {
  background: #000;
  color: #fff;
  text-align: center;
  padding: 6px 12px;
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
}
#team-name  { font-size: 22px; font-weight: bold; letter-spacing: 1px; }
#inning-lbl { font-size: 13px; margin-top: 2px; letter-spacing: 3px; opacity: 0.85; }

/* ── MAIN SPLIT ── */
#main {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-flex: 1;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

/* ── LEFT: DIAMOND ── */
#diamond-panel {
  width: 65%;
  border-right: 2px solid #000;
  padding: 4px 2px;
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: center;
  justify-content: center;
  overflow: hidden;
}
#diamond-svg { width: 100%; height: 100%; display: block; }

/* ── RIGHT: BATTING + BENCH ── */
#batting-panel {
  width: 35%;
  padding: 5px 7px;
  display: -webkit-flex;
  display: flex;
  -webkit-flex-direction: column;
  flex-direction: column;
  overflow: hidden;
}
#batting-panel h3 {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 2px;
  text-align: center;
  border-bottom: 2px solid #000;
  padding-bottom: 3px;
  margin-bottom: 4px;
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
}
#bat-list {
  list-style: none;
  -webkit-flex: 1;
  flex: 1;
  overflow: hidden;
}
#bat-list li {
  font-size: 15px;
  padding: 2px 1px;
  border-bottom: 1px solid #ddd;
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: baseline;
  align-items: baseline;
}
#bat-list li .num  { font-weight: bold; min-width: 20px; }
#bat-list li .pos  { font-size: 11px; color: #555; margin-left: auto; font-style: italic; }

/* ── BENCH SECTION ── */
#bench-wrap {
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
  border-top: 2px solid #000;
  padding-top: 4px;
  margin-top: 4px;
}
#bench-wrap h4 {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 3px;
}
#bench-list {
  list-style: none;
}
#bench-list li {
  font-size: 15px;
  padding: 2px 1px;
  border-bottom: 1px solid #eee;
  display: -webkit-flex;
  display: flex;
  gap: 4px;
}
#bench-list li .bnum { font-weight: bold; min-width: 18px; color: #555; }
#bench-list li.empty { color: #bbb; font-style: italic; }

/* ── FOOTER ── */
#footer {
  background: #ebebeb;
  border-top: 3px solid #000;
  padding: 8px 14px;
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
}
.nav-btn {
  font-family: Georgia, serif;
  font-size: 18px;
  font-weight: bold;
  padding: 11px 22px;
  background: #000;
  color: #fff;
  border: none;
  cursor: pointer;
  min-width: 85px;
  text-align: center;
  -webkit-appearance: none;
  border-radius: 2px;
}
.nav-btn:disabled { background: #aaa; }


#dots { text-align: center; }
#dots .d {
  display: inline-block;
  width: 11px; height: 11px;
  border-radius: 50%;
  border: 2px solid #000;
  margin: 0 3px;
}
#dots .d.on { background: #000; }

/* ── TABLE VIEW ── */
#table-panel {
  display: none;
  -webkit-flex: 1;
  flex: 1;
  overflow: auto;
  padding: 8px 4px;
}
#tbl {
  width: 100%;
  border-collapse: collapse;
  font-family: Georgia, serif;
}
#tbl th, #tbl td {
  border: 1px solid #000;
  text-align: center;
  padding: 5px 3px;
  font-size: 14px;
}
#tbl thead th {
  background: #000;
  color: #fff;
  font-size: 13px;
  padding: 6px 3px;
}
#tbl .pname {
  text-align: left;
  padding-left: 6px;
  white-space: nowrap;
}
#tbl .bnum { color: #888; font-size: 12px; }
.cell-bench { color: #999; font-style: italic; }
.cell-p { font-weight: bold; }
#center-ctrl {
  display: -webkit-flex;
  display: flex;
  -webkit-flex-direction: column;
  flex-direction: column;
  -webkit-align-items: center;
  align-items: center;
  gap: 5px;
}
#edit-bar { display: -webkit-flex; display: flex; gap: 6px; -webkit-align-items: center; align-items: center; }
.sm-btn {
  font-family: Georgia, serif;
  font-size: 13px;
  font-weight: bold;
  padding: 8px 14px;
  background: #000;
  color: #fff;
  border: none;
  cursor: pointer;
  -webkit-appearance: none;
  border-radius: 2px;
}
body.edit-mode #header { background: #900; }

/* ── PHONE LAYOUT (portrait screens ≤ 480px — iPhone etc.) ── */
@media screen and (max-width: 480px) {
  body { overflow: auto; height: auto; }

  #main {
    -webkit-flex-direction: column;
    flex-direction: column;
    overflow: visible;
    height: auto;
  }

  #diamond-panel {
    width: 100%;
    height: 56vw;
    min-height: 260px;
    border-right: none;
    border-bottom: 2px solid #000;
  }

  #batting-panel {
    width: 100%;
    height: auto;
    overflow: visible;
    padding: 8px 12px;
  }

  #bat-list {
    overflow: visible;
    -webkit-column-count: 2;
    column-count: 2;
    column-gap: 0;
  }
  #bat-list li {
    -webkit-column-break-inside: avoid;
    break-inside: avoid;
    font-size: 15px;
    padding: 3px 4px;
  }

  #bench-list {
    display: -webkit-flex;
    display: flex;
    -webkit-flex-wrap: wrap;
    flex-wrap: wrap;
  }
  #bench-list li { width: 50%; font-size: 15px; padding: 3px 4px; }

  #footer {
    position: static;
    -webkit-flex-wrap: wrap;
    flex-wrap: wrap;
    padding: 8px 12px;
    gap: 8px;
  }

  /* Dots on their own full-width row, above the buttons */
  #dots {
    -webkit-order: -1;
    order: -1;
    width: 100%;
    display: -webkit-flex;
    display: flex;
    -webkit-justify-content: center;
    justify-content: center;
    -webkit-align-items: center;
    align-items: center;
    padding: 2px 0;
  }
  #dots .d { margin: 0 5px; }

  .nav-btn { font-size: 14px; padding: 9px 18px; min-width: 0; }

}
</style>
</head>
<body>

<div id="header">
  <div id="team-name"></div>
  <div id="inning-lbl"></div>
</div>

<div id="main">

  <!-- ── DIAMOND ── -->
  <div id="diamond-panel">
    <svg id="diamond-svg" viewBox="0 0 320 390" xmlns="http://www.w3.org/2000/svg">

      <!-- Outfield boundary arc (dashed) -->
      <path d="M 18,182 Q 160,15 302,182"
            fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="7,4"/>

      <!-- Foul lines (light, dashed) -->
      <line x1="160" y1="342" x2="18"  y2="182" stroke="#555" stroke-width="1" stroke-dasharray="5,5"/>
      <line x1="160" y1="342" x2="302" y2="182" stroke="#555" stroke-width="1" stroke-dasharray="5,5"/>

      <!-- Infield dirt fill -->
      <polygon points="160,342 257,242 160,142 63,242"
               fill="#f3ead8" stroke="#000" stroke-width="2"/>

      <!-- Basepath lines (inside diamond, lighter) -->
      <line x1="160" y1="342" x2="257" y2="242" stroke="#c8a96e" stroke-width="1"/>
      <line x1="257" y1="242" x2="160" y2="142" stroke="#c8a96e" stroke-width="1"/>
      <line x1="160" y1="142" x2="63"  y2="242" stroke="#c8a96e" stroke-width="1"/>
      <line x1="63"  y1="242" x2="160" y2="342" stroke="#c8a96e" stroke-width="1"/>

      <!-- ── BASES ── -->
      <!-- Home plate (pentagon) -->
      <polygon points="160,352 169,342 166,332 154,332 151,342" fill="#000"/>
      <!-- 1st base -->
      <rect x="250" y="235" width="14" height="14" fill="#fff" stroke="#000" stroke-width="2"/>
      <!-- 2nd base -->
      <rect x="153" y="135" width="14" height="14" fill="#fff" stroke="#000" stroke-width="2"/>
      <!-- 3rd base -->
      <rect x="56" y="235" width="14" height="14" fill="#fff" stroke="#000" stroke-width="2"/>

      <!-- Pitcher's mound -->
      <circle cx="160" cy="227" r="7" fill="#c8a96e" stroke="#000" stroke-width="1.5"/>

      <!-- ── POSITION LABELS (filled by JS) ── -->
      <g id="pos-g" font-family="Georgia, 'Times New Roman', serif"></g>

    </svg>
  </div>

  <!-- ── BATTING + BENCH ── -->
  <div id="batting-panel">
    <h3>Batting Order</h3>
    <ul id="bat-list"></ul>
    <div id="bench-wrap">
      <h4>Bench</h4>
      <ul id="bench-list"></ul>
    </div>
  </div>

</div>

<!-- ── TABLE VIEW ── -->
<div id="table-panel"></div>

<!-- ── FOOTER / NAV ── -->
<div id="footer">
  <button class="nav-btn" id="btn-prev" onclick="go(-1)">&#9664; PREV</button>
  <div id="center-ctrl">
    <div id="dots"></div>
    <div id="edit-bar">
      <button class="sm-btn" id="btn-table" onclick="toggleTable()">TABLE</button>
      <button class="sm-btn" id="btn-edit" onclick="toggleEdit()">EDIT</button>
      <button class="sm-btn" id="btn-reset" onclick="resetLive()" style="display:none;background:#555">RESET</button>
    </div>
  </div>
  <button class="nav-btn" id="btn-next" onclick="go(1)">NEXT &#9654;</button>
</div>

<script>
// ================================================================
//   ✏️  EDIT YOUR LINEUP HERE
// ================================================================

var GAME = {

  teamName: "Raptors",   // ← Your team name

  // All players in batting order (1 through however many you have).
  batting: [
    "Connor",   //  1
    "Jonah",    //  2
    "Everett",  //  3
    "Lucas",    //  4
    "Pharoh",   //  5
    "Ollie",    //  6
    "Henry",    //  7
    "AJ",       //  8
    "Wells",    //  9
    "Kaveh",    // 10
    "August",   // 11
    "Gus",      // 12
    "Thayne"    // 13
  ],

  // One entry per inning.
  // Field keys: pitcher, catcher, first, second, third, shortstop,
  //             leftField, leftCenterField, rightCenterField, rightField
  // bench: list players sitting that inning (up to however many you have).
  innings: [
    { // ── INNING 1 ──
      pitcher:          "Connor",
      catcher:          "Gus",
      first:            "Everett",
      second:           "Lucas",
      third:            "AJ",
      shortstop:        "Pharoh",
      leftField:        "Ollie",
      leftCenterField:  "Jonah",
      rightCenterField: "August",
      rightField:       "Kaveh",
      bench: ["Henry", "Wells", "Thayne"]
    },
    { // ── INNING 2 ──
      pitcher:          "Ollie",
      catcher:          "Connor",
      first:            "Everett",
      second:           "Lucas",
      third:            "AJ",
      shortstop:        "Pharoh",
      leftField:        "Wells",
      leftCenterField:  "Jonah",
      rightCenterField: "Henry",
      rightField:       "Thayne",
      bench: ["Kaveh", "August", "Gus"]
    },
    { // ── INNING 3 ──
      pitcher:          "Everett",
      catcher:          "AJ",
      first:            "Ollie",
      second:           "Lucas",
      third:            "Henry",
      shortstop:        "Pharoh",
      leftField:        "Kaveh",
      leftCenterField:  "August",
      rightCenterField: "Gus",
      rightField:       "Wells",
      bench: ["Connor", "Jonah", "Thayne"]
    },
    { // ── INNING 4 ──
      pitcher:          "Jonah",
      catcher:          "Gus",
      first:            "Ollie",
      second:           "Everett",
      third:            "August",
      shortstop:        "Connor",
      leftField:        "Wells",
      leftCenterField:  "AJ",
      rightCenterField: "Henry",
      rightField:       "Thayne",
      bench: ["Lucas", "Pharoh", "Kaveh"]
    }
  ]

};


// ================================================================
//   ⚙️  APP CODE — no need to edit below this line
// ================================================================

// SVG (x, y) = center of label; abbr = abbreviation shown above name
var POS = {
  leftField:        { abbr: "LF",  x: 52,  y: 142 },
  leftCenterField:  { abbr: "LCF", x: 118, y: 75  },
  rightCenterField: { abbr: "RCF", x: 202, y: 75  },
  rightField:       { abbr: "RF",  x: 268, y: 142 },
  shortstop:        { abbr: "SS",  x: 103, y: 207 },
  second:           { abbr: "2B",  x: 215, y: 197 },
  pitcher:          { abbr: "P",   x: 160, y: 252 },
  third:            { abbr: "3B",  x: 63,  y: 272 },
  first:            { abbr: "1B",  x: 257, y: 272 },
  catcher:          { abbr: "C",   x: 160, y: 375 }
};

var ABBR = {
  pitcher:'P', catcher:'C', first:'1B', second:'2B', third:'3B',
  shortstop:'SS', leftField:'LF', leftCenterField:'LCF',
  rightCenterField:'RCF', rightField:'RF'
};

var cur = 0;

function makePosLabel(abbr, name, x, y, slot, isSelected) {
  var display = (name === '—') ? '—' : shortName(name);
  var w = Math.max(display.length * 9 + 10, 40);
  var h = 36;
  var fill = isSelected ? '#FFD700' : 'white';
  var open = slot
    ? '<g onclick="handleSlotClick(\'' + slot + '\')" style="cursor:pointer">'
    : '<g>';
  return (
    open +
    '<rect x="' + (x - w/2) + '" y="' + (y - 22) + '" width="' + w + '" height="' + h + '"' +
    ' fill="' + fill + '" fill-opacity="0.88" rx="2"/>' +
    '<text x="' + x + '" y="' + (y - 10) + '"' +
    ' font-size="11" font-weight="bold" fill="#555" text-anchor="middle">' + abbr + '</text>' +
    '<text x="' + x + '" y="' + (y + 8) + '"' +
    ' font-size="16" fill="#000" text-anchor="middle">' + display + '</text>' +
    '</g>'
  );
}

function render() {
  var inn = liveInnings[cur];

  // ── Diamond labels ──
  var svg = '';
  for (var pos in POS) {
    var p = POS[pos];
    svg += makePosLabel(p.abbr, inn[pos] || '—', p.x, p.y,
      editMode ? pos : null, editMode && selectedSlot === pos);
  }
  document.getElementById('pos-g').innerHTML = svg;

  // ── Batting order (with field position badge) ──
  var fieldMap = {};
  for (var p in inn) {
    if (p !== 'bench' && inn[p]) fieldMap[inn[p]] = p;
  }

  var html = '';
  for (var i = 0; i < liveBatting.length; i++) {
    var name = liveBatting[i];
    var spot = fieldMap[name];
    var badge = spot ? '<span class="pos">' + ABBR[spot] + '</span>' : '';
    var isBatSel = editMode && selectedBatIdx === i;
    var tap = editMode
      ? ' onclick="batClick(' + i + ')" style="cursor:pointer' + (isBatSel ? ';background:#FFD700' : '') + '"'
      : '';
    html += '<li' + tap + '><span class="num">' + (i + 1) + '.</span>&nbsp;' + shortName(name) + badge + '</li>';
  }
  document.getElementById('bat-list').innerHTML = html;

  // ── Bench slots ──
  var benchPlayers = inn.bench || [];
  var benchHtml = '';
  // Show at least 2 slots even if empty
  var slots = Math.max(benchPlayers.length, 2);
  for (var i = 0; i < slots; i++) {
    var slotKey = 'bench_' + i;
    var isSel = editMode && selectedSlot === slotKey;
    var tap = editMode
      ? ' onclick="handleSlotClick(\'' + slotKey + '\')" style="cursor:pointer' + (isSel ? ';background:#FFD700' : '') + '"'
      : '';
    if (benchPlayers[i]) {
      benchHtml += '<li' + tap + '><span class="bnum">' + (i + 1) + '.</span>' + benchPlayers[i] + '</li>';
    } else {
      benchHtml += '<li class="empty"' + tap + '><span class="bnum">' + (i + 1) + '.</span>—</li>';
    }
  }
  document.getElementById('bench-list').innerHTML = benchHtml;

  // ── Header ──
  document.getElementById('team-name').textContent = GAME.teamName;
  if (!tableMode) {
    document.getElementById('inning-lbl').textContent = editMode
      ? 'EDIT — tap two spots to swap'
      : 'INNING ' + (cur + 1) + ' OF ' + GAME.innings.length;
  }

  // ── Progress dots ──
  var dots = '';
  for (var i = 0; i < GAME.innings.length; i++) {
    dots += '<span class="d' + (i === cur ? ' on' : '') + '"></span>';
  }
  document.getElementById('dots').innerHTML = dots;

  // ── Nav buttons ──
  document.getElementById('btn-prev').disabled = (cur === 0);
  document.getElementById('btn-next').disabled = (cur === GAME.innings.length - 1);
}

function go(dir) {
  var next = cur + dir;
  if (next >= 0 && next < GAME.innings.length) {
    cur = next;
    selectedSlot = null;
    selectedBatIdx = null;
    render();
  }
}

// ── TABLE VIEW ──
var tableMode = false;

function toggleTable() {
  tableMode = !tableMode;
  document.getElementById('main').style.display         = tableMode ? 'none' : '';
  document.getElementById('table-panel').style.display  = tableMode ? 'block' : 'none';
  document.getElementById('btn-prev').style.display     = tableMode ? 'none' : '';
  document.getElementById('btn-next').style.display     = tableMode ? 'none' : '';
  document.getElementById('dots').style.display         = tableMode ? 'none' : '';
  document.getElementById('btn-table').textContent      = tableMode ? 'LINEUP' : 'TABLE';
  document.getElementById('inning-lbl').textContent     = tableMode
    ? 'ROTATION TABLE'
    : 'INNING ' + (cur + 1) + ' OF ' + GAME.innings.length;
  if (tableMode) buildTable();
}

function shortName(name) {
  var parts = name.trim().split(' ');
  return parts.length < 2 ? name : parts[0] + ' ' + parts[1][0] + '.';
}

function buildTable() {
  var innings = liveInnings;
  var n = innings.length;

  // slot map: playerName → {abbr, slot}
  var maps = [];
  for (var i = 0; i < n; i++) {
    var inn = innings[i];
    var m = {};
    for (var pos in ABBR) {
      if (inn[pos]) m[inn[pos]] = {abbr: ABBR[pos], slot: pos};
    }
    if (inn.bench) {
      for (var b = 0; b < inn.bench.length; b++) {
        if (inn.bench[b]) m[inn.bench[b]] = {abbr: 'B', slot: 'bench_' + b};
      }
    }
    maps.push(m);
  }

  var html = '<table id="tbl"><thead><tr><th>Player</th>';
  for (var i = 0; i < n; i++) html += '<th>INN ' + (i + 1) + '</th>';
  html += '</tr></thead><tbody>';

  for (var b = 0; b < liveBatting.length; b++) {
    var name = liveBatting[b];
    html += '<tr><td class="pname"><span class="bnum">' + (b + 1) + '.&nbsp;</span>' + shortName(name) + '</td>';
    for (var i = 0; i < n; i++) {
      var entry = maps[i][name];
      var abbr  = entry ? entry.abbr : '?';
      var slot  = entry ? entry.slot : null;
      var isSel = tableSelectedCell && tableSelectedCell.inning === i && tableSelectedCell.slot === slot;
      var cellCls   = abbr === 'B' ? 'cell-bench' : abbr === 'P' ? 'cell-p' : '';
      var cellStyle = (editMode && slot ? 'cursor:pointer;' : '') + (isSel ? 'background:#FFD700' : '');
      var cellClick = (editMode && slot) ? ' onclick="tableClick(' + i + ',\'' + slot + '\')"' : '';
      html += '<td' + (cellCls ? ' class="' + cellCls + '"' : '') + cellClick + (cellStyle ? ' style="' + cellStyle + '"' : '') + '>' + abbr + '</td>';
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  document.getElementById('table-panel').innerHTML = html;
}

// ── EDIT MODE ──
var liveInnings = null;
var liveBatting  = null;
var editMode = false;
var selectedSlot = null;
var selectedBatIdx = null;
var tableSelectedCell = null;

function initLive() {
  var saved = null;
  try {
    var raw = localStorage.getItem('lineup_' + GAME.teamName);
    if (raw) {
      var p = JSON.parse(raw);
      if (p.key === GAME.batting.join(',')) saved = p;
    }
  } catch(e) {}
  liveInnings = (saved && saved.innings) || JSON.parse(JSON.stringify(GAME.innings));
  liveBatting  = (saved && saved.batting) || JSON.parse(JSON.stringify(GAME.batting));
}

function saveLive() {
  try {
    localStorage.setItem('lineup_' + GAME.teamName, JSON.stringify({
      key:     GAME.batting.join(','),
      innings: liveInnings,
      batting: liveBatting
    }));
  } catch(e) {}
}

function resetLive() {
  liveInnings = JSON.parse(JSON.stringify(GAME.innings));
  liveBatting  = JSON.parse(JSON.stringify(GAME.batting));
  saveLive();
  selectedSlot = null;
  selectedBatIdx = null;
  tableSelectedCell = null;
  render();
  if (tableMode) buildTable();
}

function toggleEdit() {
  editMode = !editMode;
  selectedSlot = null;
  selectedBatIdx = null;
  tableSelectedCell = null;
  var btn = document.getElementById('btn-edit');
  btn.textContent = editMode ? 'DONE' : 'EDIT';
  btn.style.background = editMode ? '#b00' : '';
  document.getElementById('btn-reset').style.display = editMode ? '' : 'none';
  document.getElementById('btn-table').style.display = editMode ? 'none' : '';
  document.body.className = editMode ? 'edit-mode' : '';
  if (tableMode) {
    document.getElementById('inning-lbl').textContent = editMode
      ? 'EDIT — tap same column to swap'
      : 'ROTATION TABLE';
    buildTable();
  }
  render();
}

function handleSlotClick(slot) {
  if (!editMode) return;
  if (selectedSlot === null) {
    selectedSlot = slot;
  } else if (selectedSlot === slot) {
    selectedSlot = null;
  } else {
    swapSlots(selectedSlot, slot, cur);
    selectedSlot = null;
    saveLive();
  }
  render();
}

function batClick(idx) {
  if (!editMode) return;
  if (selectedBatIdx === null) {
    selectedBatIdx = idx;
  } else if (selectedBatIdx === idx) {
    selectedBatIdx = null;
  } else {
    var tmp = liveBatting[selectedBatIdx];
    liveBatting[selectedBatIdx] = liveBatting[idx];
    liveBatting[idx] = tmp;
    selectedBatIdx = null;
    saveLive();
    if (tableMode) buildTable();
  }
  render();
}

function tableClick(inning, slot) {
  if (!editMode) return;
  if (tableSelectedCell === null || tableSelectedCell.inning !== inning) {
    tableSelectedCell = {inning: inning, slot: slot};
    buildTable();
    return;
  }
  if (tableSelectedCell.slot === slot) {
    tableSelectedCell = null;
    buildTable();
    return;
  }
  // Same inning, different slot — swap
  swapSlots(tableSelectedCell.slot, slot, inning);
  tableSelectedCell = null;
  saveLive();
  buildTable();
}

function swapSlots(a, b, innIdx) {
  var inn = liveInnings[innIdx !== undefined ? innIdx : cur];
  function getVal(s) {
    if (s.indexOf('bench_') === 0) return (inn.bench || [])[parseInt(s.slice(6))] || null;
    return inn[s] || null;
  }
  function setVal(s, v) {
    if (s.indexOf('bench_') === 0) {
      if (!inn.bench) inn.bench = [];
      inn.bench[parseInt(s.slice(6))] = v;
    } else { inn[s] = v; }
  }
  var va = getVal(a), vb = getVal(b);
  setVal(a, vb);
  setVal(b, va);
}

initLive();
render();
</script>
</body>
</html>
